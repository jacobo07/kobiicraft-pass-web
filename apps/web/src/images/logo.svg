<svg version="1.1" viewBox="0 0 290 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KobiiCraft Pass">
  <title>KobiiCraft Pass</title>
  <!-- KobiiCraft Pass wordmark lockup.
       viewBox matches the upstream logo.svg (0 0 290 60) exactly so any CSS
       sizing that targeted the original keeps behaving identically.
       Navy #1F3A5F badge, gold #9C7B3C wordmark. Gold is deliberate: cream is
       invisible on the light default theme and navy is invisible on dark, so a
       single gold wordmark is the only one-asset choice that clears contrast on
       BOTH Vaultwarden themes. Hierarchy comes from size and weight. -->
  <rect x="2" y="6" width="48" height="48" rx="12" fill="#1F3A5F" stroke="#9C7B3C" stroke-width="2"/>
  <text x="26" y="39" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#FAF7F2">K<tspan fill="#9C7B3C">P</tspan></text>
  <text x="64" y="29" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9C7B3C" letter-spacing="0.2">KobiiCraft</text>
  <text x="65" y="50" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#7A5E2E" letter-spacing="3.8">PASS</text>
</svg>
