<svg version="1.1" fill="#fff" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KobiiCraft Pass Icon">
  <title>KobiiCraft Pass Icon - White</title>
  <!-- Monochrome WHITE mark, matching the role of the upstream icon-white.svg:
       it is rendered on dark surfaces where a silhouette is expected, so this
       is deliberately not the navy/gold badge. Same 0 0 32 32 viewBox and the
       same fill="#fff" root attribute as upstream, so it drops in without any
       layout or color-inheritance change. -->
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="6.5" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="16" y="22.5" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">KP</text>
</svg>
